<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Henri Korpela</title>

    <style>
        :root {
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;

            --color-bg: #eef0f5;
            --color-surface: #ffffff;
            --color-heading: #1c2333;
            --color-muted: #6b7385;
            --color-accent-dark: #1f5e5e;

            --radius-lg: 16px;
            --shadow-card: 0 1px 2px rgba(28, 35, 51, 0.04), 0 8px 24px rgba(28, 35, 51, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: var(--color-bg);
            display: flex;
            font-family: var(--font-family);
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 16px;
        }

        main {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            max-width: 420px;
            padding: 32px;
            text-align: center;
            width: 100%;
        }

        h1 {
            color: var(--color-heading);
            font-size: 28px;
            margin: 0 0 4px 0;
        }

        p {
            color: var(--color-muted);
            margin: 0 0 24px 0;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        nav a {
            background: var(--color-heading);
            border-radius: 999px;
            color: white;
            flex: 1;
            font-weight: 600;
            padding: 12px 16px;
            text-decoration: none;
            transition: background 0.15s;
        }

        nav a:hover,
        nav a:focus-visible {
            background: var(--color-accent-dark);
        }
    </style>
</head>

<body>
    <main>
        <h1>Henri Korpela</h1>
        <p>Full stack -ohjelmistokehittäjä</p>
        <nav>
            <a href="./cv.html">CV</a>
            <a href="./resume.html">Resume</a>
        </nav>
    </main>
</body>

</html>
